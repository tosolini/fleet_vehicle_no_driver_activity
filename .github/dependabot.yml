version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Rome"
    assignees:
      - "tosolini"
    labels:
      - "dependencies"
      - "security"
    open-pull-requests-limit: 10

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:10"
      timezone: "Europe/Rome"
    assignees:
      - "tosolini"
    labels:
      - "dependencies"
      - "security"
    open-pull-requests-limit: 10
